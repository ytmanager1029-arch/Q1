<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Q1 project homepage" />
    <title>Q1</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #182230;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top right, #dbeafe 0, transparent 38%), #f5f7fb;
      }
      main {
        width: min(720px, 100%);
        padding: clamp(32px, 7vw, 72px);
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 70px rgba(30, 41, 59, 0.12);
      }
      .eyebrow {
        margin: 0 0 14px;
        color: #2563eb;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(3rem, 11vw, 6rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }
      p {
        max-width: 46ch;
        margin: 24px 0 0;
        color: #526173;
        font-size: 1.08rem;
        line-height: 1.7;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 32px;
        padding: 10px 14px;
        border-radius: 999px;
        background: #eff6ff;
        color: #1d4ed8;
        font-size: 0.9rem;
        font-weight: 650;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Project</p>
      <h1>Q1</h1>
      <p>This repository is now configured as a lightweight static site and is ready to be hosted on Vercel.</p>
      <div class="status"><span class="dot" aria-hidden="true"></span>Deployment-ready</div>
    </main>
  </body>
</html>
